[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API proxy → Render backend (same-origin for admin cookies)
[[redirects]]
  from = "/api/*"
  to = "https://novora-solutions-website-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://novora-solutions-website-backend.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
